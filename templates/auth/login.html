{% extends "base.html" %}

{% block title %}Login | ProHospital{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="auth-card">
        <span class="eyebrow">Acceso seguro</span>
        <h1>Iniciar sesion</h1>
        <p>Administradores y pacientes entran desde aqui. El sistema te redirige automaticamente al panel que corresponde a tu rol.</p>

        <form method="POST" class="form-card mt-4">
            <div class="row g-4">
                <div class="col-12">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="admin o usuario del paciente" required>
                </div>
                <div class="col-12">
                    <label for="password" class="form-label">Contrasena</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
            </div>

            <div class="form-actions mt-4">
                <button type="submit" class="btn btn-brand">Entrar al sistema</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
