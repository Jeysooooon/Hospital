{% extends "base.html" %}

{% block title %}Editar Especialidad | ProHospital{% endblock %}

{% block content %}
<section class="page-card narrow-page">
    <div class="section-heading">
        <div>
            <span class="eyebrow">Actualización</span>
            <h1>Editar especialidad</h1>
            <p>Modifica la información para mantener actualizado el catálogo de áreas médicas.</p>
        </div>
    </div>

    <form action="" method="POST" class="form-card">
        <div class="mb-4">
            <label for="EspNombre" class="form-label">Nombre</label>
            <input type="text" id="EspNombre" name="EspNombre" class="form-control" value="{{ especialidad.1 }}" required>
        </div>

        <div class="mb-4">
            <label for="EspDescripcion" class="form-label">Descripción</label>
            <textarea id="EspDescripcion" name="EspDescripcion" class="form-control" rows="4" required>{{ especialidad.2 }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-brand">Actualizar información</button>
            <a href="{{ url_for('especialidad_index') }}" class="btn btn-outline-soft">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
