{% extends "base.html" %}

{% block title %}Editar Doctor | ProHospital{% endblock %}

{% block content %}
<section class="page-card narrow-page">
    <div class="section-heading">
        <div>
            <span class="eyebrow">Edición</span>
            <h1>Editar doctor</h1>
            <p>Ajusta la información del registro para mantener exactos los datos del personal médico.</p>
        </div>
    </div>

    <form action="" method="POST" class="form-card">
        <div class="row g-4">
            <div class="col-md-6">
                <label for="DocNombre" class="form-label">Nombre</label>
                <input type="text" id="DocNombre" name="DocNombre" class="form-control" value="{{ doctor.1 }}" required>
            </div>
            <div class="col-md-6">
                <label for="DocApellido" class="form-label">Apellido</label>
                <input type="text" id="DocApellido" name="DocApellido" class="form-control" value="{{ doctor.2 }}" required>
            </div>
            <div class="col-md-6">
                <label for="DocEspecialidad" class="form-label">Especialidad</label>
                <input type="text" id="DocEspecialidad" name="DocEspecialidad" class="form-control" value="{{ doctor.3 }}" required>
            </div>
            <div class="col-md-6">
                <label for="DocTelefono" class="form-label">Teléfono</label>
                <input type="text" id="DocTelefono" name="DocTelefono" class="form-control" value="{{ doctor.4 }}">
            </div>
            <div class="col-12">
                <label for="DocCorreo" class="form-label">Correo electrónico</label>
                <input type="email" id="DocCorreo" name="DocCorreo" class="form-control" value="{{ doctor.5 }}">
            </div>
        </div>

        <div class="form-actions mt-4">
            <button type="submit" class="btn btn-brand">Actualizar información</button>
            <a href="{{ url_for('doctores_index') }}" class="btn btn-outline-soft">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
