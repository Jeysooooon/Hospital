{% extends "base.html" %}

{% block title %}Agregar Paciente | ProHospital{% endblock %}

{% block content %}
<section class="page-card narrow-page">
    <div class="section-heading">
        <div>
            <span class="eyebrow">Nuevo paciente</span>
            <h1>Agregar paciente</h1>
            <p>Registra datos de identificación y contacto con una interfaz más clara y mejor distribuida.</p>
        </div>
    </div>

    <form action="{{ url_for('pacientes_agregar') }}" method="POST" class="form-card">
        <div class="row g-4">
            <div class="col-md-6">
                <label for="PacNombre" class="form-label">Nombre</label>
                <input type="text" id="PacNombre" name="PacNombre" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label for="PacApellido" class="form-label">Apellido</label>
                <input type="text" id="PacApellido" name="PacApellido" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label for="PacDNI" class="form-label">Identidad (DNI)</label>
                <input type="text" id="PacDNI" name="PacDNI" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label for="PacTelefono" class="form-label">Teléfono</label>
                <input type="text" id="PacTelefono" name="PacTelefono" class="form-control">
            </div>
            <div class="col-12">
                <label for="PacDireccion" class="form-label">Dirección</label>
                <textarea id="PacDireccion" name="PacDireccion" class="form-control" rows="4" placeholder="Colonia, calle, referencia o dirección completa."></textarea>
            </div>
        </div>

        <div class="form-actions mt-4">
            <button type="submit" class="btn btn-save">Guardar paciente</button>
            <a href="{{ url_for('pacientes_index') }}" class="btn btn-outline-soft">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
